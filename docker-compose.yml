version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    container_name: reviewlens-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reviewlens-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=prod
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=reviews
      - PORT=8080
    env_file:
      - .env
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - ./data:/app/data:ro

volumes:
  qdrant_storage:
